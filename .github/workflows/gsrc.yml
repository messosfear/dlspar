name: Download Googlesource Path

on:
  workflow_dispatch:
    inputs:
      url:
        description: "googlesource URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Parse URL, clone, and fetch path
        shell: bash
        run: |
          set -euo pipefail

          URL='${{ inputs.url }}'

          parse_url() {
            local url="$1"
            local repo ref path rest

            # Remove query / fragment
            url="${url%%\#*}"
            url="${url%%\?*}"

            # Must be a googlesource tree/blob style URL
            if [[ "$url" != *"/+/"* ]]; then
              echo "Unsupported URL format: $url"
              return 1
            fi

            repo="${url%%/+/ *}"
            repo="${url%%/+/*}"

            rest="${url#*'/+/'}"

            # Supported forms:
            #   /+/refs/heads/main/path/to/dir
            #   /+/refs/tags/v1.0/path/to/dir
            #   /+/main/path/to/dir
            #   /+/some-commit/path/to/dir
            #
            # We treat the first path segment after /+/ as ref/revision,
            # and the remainder as the target path.
            ref="${rest%%/*}"
            path="${rest#*/}"

            # If there's no slash after /+/, it's a root or invalid case
            if [[ "$rest" == "$ref" ]]; then
              path=""
            fi

            # Normalize common ref prefixes
            if [[ "$ref" == refs/heads/* ]]; then
              ref="${ref#refs/heads/}"
            elif [[ "$ref" == refs/tags/* ]]; then
              ref="${ref#refs/tags/}"
            elif [[ "$ref" == refs/* ]]; then
              ref="${ref#refs/}"
            fi

            echo "$repo|$ref|$path"
          }

          parsed="$(parse_url "$URL")"
          repo_url="${parsed%%|*}"
          rest="${parsed#*|}"
          ref="${rest%%|*}"
          path="${rest#*|}"

          if [[ -z "$repo_url" || -z "$ref" ]]; then
            echo "Failed to parse URL: $URL"
            exit 1
          fi

          echo "Repo: $repo_url"
          echo "Ref:  $ref"
          echo "Path: ${path:-<repo root>}"

          rm -rf repo artifact
          git clone --depth 1 --single-branch --branch "$ref" --filter=blob:none --sparse "$repo_url" repo
          cd repo

          if [[ -n "$path" ]]; then
            git sparse-checkout set "$path"
          fi

          mkdir -p ../artifact

          if [[ -n "$path" ]]; then
            if [[ ! -e "$path" ]]; then
              echo "Path not found in repository: $path"
              exit 1
            fi
            cp -R "$path" ../artifact/
          else
            cp -R . ../artifact/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: googlesource-content
          path: artifact/
          if-no-files-found: error
