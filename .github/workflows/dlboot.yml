name: Download AOSP Folder
on:
  workflow_dispatch:
    inputs:
      directory_path:
        description: 'The path to the folder you want to download (e.g., core/java/android/widget)'
        required: true
        default: 'core/java/android/widget'

jobs:
  fetch-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse Checkout AOSP
        run: |
          # Clone the repo without checking out any files initially
          git clone --filter=blob:none --no-checkout https://android.googlesource.com/platform/frameworks/base aosp_base
          
          cd aosp_base
          
          # Initialize sparse-checkout and set the target directory from input
          git sparse-checkout init --cone
          git sparse-checkout set ${{ github.event.inputs.directory_path }}
          
          # Pull the files for the specified path from the master branch
          git checkout master

      - name: Upload Folder as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aosp-folder-download
          path: aosp_base/${{ github.event.inputs.directory_path }}/
