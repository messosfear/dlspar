name: Download Audio via yt-dlp (Static Binary)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'The YouTube URL to download audio from'
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp (Static Binary)
        run: |
          echo "Downloading latest yt-dlp static binary..."
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o yt-dlp
          chmod +x yt-dlp
          sudo mv yt-dlp /usr/local/bin/yt-dlp
          
          echo "Verifying installation..."
          yt-dlp --version

      - name: Install FFmpeg (Required for audio conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download audio from YouTube
        run: |
          echo "Downloading audio from: ${{ inputs.youtube_url }}"
          
          # Download and convert to MP3
          yt-dlp --extract-audio --audio-format mp3 --output "downloaded_audio.mp3" "${{ inputs.youtube_url }}"
          
          if [ ! -f "downloaded_audio.mp3" ]; then
            echo "Error: Audio file was not created. Check logs for details."
            exit 1
          fi
          
          echo "Download successful."

      - name: Upload audio as artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-audio-download
          path: downloaded_audio.mp3
          retention-days: 5
          if-no-files-found: error
